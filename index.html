<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#c4d5ac"><title>Lashroom Tools</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="lashroom-icon.png"><link rel="icon" type="image/png" href="lashroom-icon.png"><style>html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}body{font:16px system-ui;background:#faf7ef;color:#43543a;max-width:600px;margin:auto;padding:20px 20px 90px}button,input,select{font:inherit;padding:12px;border:1px solid #c4d5ac;border-radius:12px;background:white;color:inherit;box-sizing:border-box}button{background:#c4d5ac;cursor:pointer}input,select{width:100%;margin:5px 0}article,form{background:white;border-radius:18px;padding:16px;margin:12px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#e3ebd8;display:flex;justify-content:center;gap:4px;padding:12px}nav button{padding:10px}small{display:block}h1{font-size:28px}</style><h1>Lashroom Tools</h1><main id="main"></main><nav><button onclick="show('calendar')">Записи</button><button onclick="show('clients')">Клієнти</button><button onclick="show('money')">Доходи</button><button onclick="show('settings')">⚙</button></nav><script>
const main=document.querySelector('main');let records=JSON.parse(localStorage.getItem('lash-records')||'[]');let reminders=JSON.parse(localStorage.getItem('lash-reminders')||'[1440,120]');const save=()=>{localStorage.setItem('lash-records',JSON.stringify(records));syncPush()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let date=new Date();const localDay=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);let day=localDay(date);
function show(tab){if(tab==='calendar'){main.innerHTML='<h2>Календар</h2><input type="date" id="day"><form id="add"><h3>Новий запис</h3><input name="name" placeholder="Ім’я клієнта" required><input name="time" type="time" required><input name="service" placeholder="Послуга (необов’язково)"><input name="price" type="number" min="0" placeholder="Ціна, грн (необов’язково)"><button>Додати запис</button></form><div id="list"></div>';document.querySelector('#day').value=day;document.querySelector('#day').onchange=e=>{day=e.target.value;show(tab)};document.querySelector('#add').onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(e.target));records.push({...r,day,id:crypto.randomUUID(),done:false});save();show(tab)};document.querySelector('#list').innerHTML=records.filter(r=>r.day===day).sort((a,b)=>a.time.localeCompare(b.time)).map(r=>'<article><b>'+esc(r.time)+' · '+esc(r.name)+'</b><p>'+[r.service?esc(r.service):'',r.price!==''&&r.price!=null?esc(r.price)+' грн':''].filter(Boolean).join(' · ')+'</p><button onclick="done(\''+r.id+'\')">'+(r.done?'Виконано ✓':'Завершити')+'</button> <button onclick="removeRecord(\''+r.id+'\')">Видалити</button></article>').join('')||'Записів немає';}else if(tab==='clients'){main.innerHTML='<h2>Клієнти</h2>'+[...new Set(records.map(r=>r.name))].map(n=>'<article><b>'+esc(n)+'</b><p>Записів: '+records.filter(r=>r.name===n).length+'</p></article>').join('')}else if(tab==='money'){main.innerHTML='<h2>Доходи</h2><article>За місяць: '+records.filter(r=>r.done&&r.day.startsWith(localDay(new Date()).slice(0,7))).reduce((s,r)=>s+Number(r.price),0)+' грн</article>'}else{main.innerHTML='<h2>Налаштування</h2><article><button onclick="checkUpdate()">Перевірити оновлення</button><p id="updateStatus">Версія 1.0.8</p></article><article><h3>Нагадування про запис</h3><div id="reminders"></div><button onclick="addReminder()">+ Додати нагадування</button><p>Можна вибрати кілька інтервалів одночасно.</p><button onclick="enablePush()">Увімкнути push</button> <button onclick="disablePush()">Вимкнути</button> <button onclick="syncPush(true)">Тестове повідомлення</button><p id="pushStatus"></p></article>';renderReminders();pushStatus(localStorage.getItem('lash-push-enabled')?'Push увімкнено':'Push вимкнено')}}
function renderReminders(){const el=document.querySelector('#reminders');el.innerHTML=reminders.map((m,i)=>{const unit=m%1440===0?1440:m%60===0?60:1;return '<div style="display:flex;gap:8px;align-items:center;margin:10px 0"><span>За</span><input aria-label="Кількість" style="width:80px" type="number" min="1" max="'+Math.floor(43200/unit)+'" value="'+(m/unit)+'" onchange="editReminder('+i+',this.parentElement)"><select aria-label="Одиниця часу" style="flex:1;width:auto" onchange="editReminder('+i+',this.parentElement)">'+[[1440,'Діб'],[60,'Годин'],[1,'Хвилин']].map(([v,t])=>'<option value="'+v+'" '+(v===unit?'selected':'')+'>'+t+'</option>').join('')+'</select><button aria-label="Видалити" onclick="deleteReminder('+i+')">×</button></div>'}).join('')}
function editReminder(i,row){const n=Number(row.querySelector('input').value),u=Number(row.querySelector('select').value);changeReminder(i,n*u)}
function persistReminders(){reminders=[...new Set(reminders)].sort((a,b)=>b-a);localStorage.setItem('lash-reminders',JSON.stringify(reminders));renderReminders();syncPush()}
function addReminder(m=60){if(reminders.includes(m)){if(m!==60)return;while(reminders.includes(m))m+=15}reminders.push(m);persistReminders()}
function changeReminder(i,m){m=Number(m);if(Number.isInteger(m)&&m>=1&&m<=43200){reminders[i]=m;persistReminders()}else renderReminders()}
function deleteReminder(i){reminders.splice(i,1);persistReminders()}
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
function done(id){let r=records.find(r=>r.id===id);r.done=!r.done;save();show('calendar')}function removeRecord(id){if(confirm('Видалити запис?')){records=records.filter(r=>r.id!==id);save();show('calendar')}}const pushApi='https://dhphxdkcmafeyanwypsm.supabase.co/functions/v1/';let pushChain=Promise.resolve();function deviceToken(){let t=localStorage.getItem('lash-push-token');if(!t){t=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('lash-push-token',t)}return t}function pushStatus(t){const e=document.querySelector('#pushStatus');if(e)e.textContent=t}async function pushRequest(b){const r=await fetch(pushApi+'push-device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:deviceToken(),...b})});if(!r.ok)throw Error('Server '+r.status)}function syncPush(test=false){const run=async()=>{if(!localStorage.getItem('lash-push-enabled'))return;const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(!sub)throw Error('Немає підписки');const jobs=records.filter(r=>!r.done).flatMap(r=>reminders.map(m=>({id:r.id+'-'+m,at:new Date(r.day+'T'+r.time).getTime()-m*60000}))).filter(j=>j.at>Date.now());if(test)jobs.push({id:'test-'+crypto.randomUUID(),at:Date.now()});await pushRequest({subscription:sub.toJSON(),jobs});pushStatus(test?'Тест заплановано, очікуй до 1–2 хвилин':'Нагадування синхронізовано')};pushChain=pushChain.catch(()=>{}).then(run).catch(e=>pushStatus('Помилка: '+e.message));return pushChain}async function enablePush(){try{if(!('PushManager'in window)||!('Notification'in window))throw Error('Встанови додаток на головний екран');if(await Notification.requestPermission()!=='granted')throw Error('Дозвіл не надано');const reg=await navigator.serviceWorker.ready;const cfg=await fetch(pushApi+'push-config').then(r=>r.json());if(!cfg.configured)throw Error('Серверні ключі не налаштовано');let sub=await reg.pushManager.getSubscription();if(!sub){const k=cfg.publicKey.replace(/-/g,'+').replace(/_/g,'/');sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:Uint8Array.from(atob(k.padEnd(Math.ceil(k.length/4)*4,'=')),c=>c.charCodeAt(0))})}localStorage.setItem('lash-push-enabled','1');await syncPush()}catch(e){pushStatus('Помилка: '+e.message)}}async function disablePush(){try{await pushChain;await pushRequest({disable:true});const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();if(sub)await sub.unsubscribe();localStorage.removeItem('lash-push-enabled');pushStatus('Вимкнено')}catch(e){pushStatus('Помилка: '+e.message)}}window.addEventListener('online',()=>syncPush());show('calendar');syncPush();let refreshing=false;async function checkUpdate(){const status=document.querySelector('#updateStatus');if(status)status.textContent='Перевіряємо…';try{if(!navigator.onLine)throw Error('offline');const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update();location.replace(location.pathname+'?v='+Date.now())}catch(e){if(status)status.textContent='Не вдалося перевірити. Перевірте інтернет.'}}if('serviceWorker'in navigator){navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(console.error);document.addEventListener('visibilitychange',()=>{if(!document.hidden)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(console.error)})}
</script></html>
