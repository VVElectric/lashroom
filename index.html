<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c4d5ac"><title>Lashrom Tools</title><link rel="manifest" href="manifest.json"><style>body{font:16px system-ui;background:#faf7ef;color:#43543a;max-width:600px;margin:auto;padding:20px 20px 90px}button,input,select{font:inherit;padding:12px;border:1px solid #c4d5ac;border-radius:12px;background:white;color:inherit;box-sizing:border-box}button{background:#c4d5ac;cursor:pointer}input,select{width:100%;margin:5px 0}article,form{background:white;border-radius:18px;padding:16px;margin:12px 0}nav{position:fixed;bottom:0;left:0;right:0;background:#e3ebd8;display:flex;justify-content:center;gap:4px;padding:12px}nav button{padding:10px}small{display:block}h1{font-size:28px}</style><h1>Lashrom Tools</h1><main id="main"></main><nav><button onclick="show('calendar')">Записи</button><button onclick="show('clients')">Клієнти</button><button onclick="show('money')">Доходи</button><button onclick="show('settings')">⚙</button></nav><script>
const main=document.querySelector('main');let records=JSON.parse(localStorage.getItem('lash-records')||'[]');let minutes=Number(localStorage.getItem('lash-minutes')||60);const save=()=>localStorage.setItem('lash-records',JSON.stringify(records));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let date=new Date();const localDay=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);let day=localDay(date);
function show(tab){if(tab==='calendar'){main.innerHTML='<h2>Календар</h2><input type="date" id="day"><form id="add"><h3>Новий запис</h3><input name="name" placeholder="Ім’я клієнта" required><input name="time" type="time" required><input name="service" placeholder="Послуга" required><input name="price" type="number" min="0" placeholder="Ціна, грн" required><button>Додати запис</button></form><div id="list"></div>';document.querySelector('#day').value=day;document.querySelector('#day').onchange=e=>{day=e.target.value;show(tab)};document.querySelector('#add').onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(e.target));records.push({...r,day,id:crypto.randomUUID(),done:false});save();show(tab)};document.querySelector('#list').innerHTML=records.filter(r=>r.day===day).sort((a,b)=>a.time.localeCompare(b.time)).map(r=>'<article><b>'+esc(r.time)+' · '+esc(r.name)+'</b><p>'+esc(r.service)+' · '+esc(r.price)+' грн</p><button onclick="done(\''+r.id+'\')">'+(r.done?'Виконано ✓':'Завершити')+'</button> <button onclick="removeRecord(\''+r.id+'\')">Видалити</button></article>').join('')||'Записів немає';}else if(tab==='clients'){main.innerHTML='<h2>Клієнти</h2>'+[...new Set(records.map(r=>r.name))].map(n=>'<article><b>'+esc(n)+'</b><p>Записів: '+records.filter(r=>r.name===n).length+'</p></article>').join('')}else if(tab==='money'){main.innerHTML='<h2>Доходи</h2><article>За місяць: '+records.filter(r=>r.done&&r.day.startsWith(localDay(new Date()).slice(0,7))).reduce((s,r)=>s+Number(r.price),0)+' грн</article>'}else{main.innerHTML='<h2>Налаштування</h2><label>Нагадування за (хвилин)<input id="mins" type="number" min="1" value="'+minutes+'"></label><button onclick="minutes=Math.max(1,Number(document.querySelector(\'#mins\').value));localStorage.setItem(\'lash-minutes\',minutes)">Зберегти</button><p>Дані цієї версії зберігаються лише на пристрої. Фонові push-сповіщення ще не підключені.</p>'}}
function done(id){let r=records.find(r=>r.id===id);r.done=!r.done;save();show('calendar')}function removeRecord(id){if(confirm('Видалити запис?')){records=records.filter(r=>r.id!==id);save();show('calendar')}}show('calendar');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(console.error);
</script></html>
